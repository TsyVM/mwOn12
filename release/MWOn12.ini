; MWOn12 configuration
; Need for Speed: Most Wanted (2005) — DirectX 9 to DirectX 12
;
; Drop d3d9.dll and this file into the folder containing speed.exe.
; Everything here is read once at launch. Change a value and restart.

; ── Renderer ──────────────────────────────────────────────────────────────────
[Renderer]
; 2 = DirectX 12 — MWOn12's own translation. This is the point of the project.
; 1 = DirectX 9  — no translation at all: the game is handed to the system
;                  d3d9.dll untouched. An escape hatch for a machine with no
;                  Direct3D 12 adapter, not a second renderer.
;
; MWOn12 falls back to 1 by itself if no D3D12 feature-level-11_0 adapter is
; present, and says so in MWOn12.log.
;
; (MWDX numbered these 1/2/3 with 2 meaning DirectX 11. An old ini that says 3
; is still accepted and means DirectX 12.)
Backend=2

; ── Translation options (Backend=2) ──────────────────────────────────────────
; Correct the sub-pixel sampling difference between Direct3D 9 and later APIs.
HalfPixelFix=0
; Restore DX9 colour-iterator defaults so HUD sprites render correctly.
LegacyColorDefault=1
; Cache translated shaders to disk for faster subsequent loads.
; Ignored while ShaderMods or ShaderDump is on, so an edited shader is never
; masked by a cached copy of the original.
ShaderDiskCache=1
; Reduce input latency by limiting the frame queue to 1.
LowLatency=1
; Borderless fullscreen instead of exclusive mode (recommended, leave at 1).
BorderlessFullscreen=1
; Megabytes of upload staging per frame (three frames are in flight).
; 0 = backend default. The ring grows by itself when a loading burst needs
; more, so this is only worth setting if the log says the growth allowance was
; spent too — the message names the figure to use.
UploadRingMB=0
; While a BeginStateBlock/EndStateBlock recording is open, add each state
; change to the block only (1, correct) or also apply it to the device (0).
StateBlockRecordOnly=1

; ── Shader editing ────────────────────────────────────────────────────────────
; These two are meant to be used together: set both to 1 and leave them on.
; Play to fill MWOn12\Shaders\Dumped with the shaders the game actually used,
; copy one up into MWOn12\Shaders, edit it, and restart.
;
; Writes every shader MWOn12 generates to MWOn12\Shaders\Dumped as .hlsl. Only
; ever writes the original, and only into Dumped, so it cannot overwrite edits.
ShaderDump=0
; Loads edited .hlsl files from MWOn12\Shaders in place of the generated ones.
; Read at launch, so restart after changing a file. A file that fails to
; compile is logged and the original is used instead — a bad edit is never
; fatal.
ShaderMods=0

; ── Diagnostics ───────────────────────────────────────────────────────────────
; All off for normal play. Each one costs performance.
;
; Full Info/Trace detail in MWOn12-render.log, beside the exe. (MWOn12.log is
; the loader's own log and always carries the backend banner; the per-draw and
; per-bind translation detail goes to MWOn12-render.log.) Implied by
; DebugLayer=1. Plugin log output is also Info-level, so turn this on to see it.
VerboseLog=0
; Periodic frame counters, including the draw funnel, in MWOn12-render.log.
PerfLog=0
; D3D12 debug/validation layer. Requires the Graphics Tools optional feature.
DebugLayer=0
; GPU-based validation. Separate key because it is orders of magnitude slower
; than DebugLayer alone; only needed to chase shader-side out-of-bounds
; descriptor access, not a plain "why was the device removed" run.
GpuValidation=0
; If the game ever dies with "device removed", turn this on and reproduce it:
; the log will then name the exact GPU command that faulted. Needs nothing
; installed, but writes a marker for every command.
DredBreadcrumbs=0
; Per-draw census in MWOn12-render.log — one 'census#' line per draw. Needed to
; diagnose HUD and offscreen render-target faults (minimap, speedometer, world
; map). Press F11 in game to capture the next 6 frames of whatever is on
; screen; without the key it only arms itself in-race.
DumpFrame=0
; How many census lines DumpFrame emits before stopping. Raise when the draws
; of interest happen late in the frame.
CensusLimit=6000
; Log every path that writes into a texture — locks, UpdateSurface,
; UpdateTexture — with the surface's size, pool and the rectangle touched.
; Needs VerboseLog=1 as well. Use when something draws with the wrong contents
; rather than in the wrong place.
TextureTrace=0
; Bind every texture/sampler/state unconditionally instead of skipping binds
; the cache believes are already set. Slower; use to test whether a stale bind
; cache is causing wrong textures on screen.
NoBindCache=0

; ── Plugins ───────────────────────────────────────────────────────────────────
; MWOn12 loads every .dll in MWOn12\Plugins\ that exports MWOn12PluginMain.
; See MWOn12SDK to write one. Plugins read their own settings from this file;
; give each its own section, like the example below.
;
; [MyPlugin]
; Enabled=1

; ── ASI mods ──────────────────────────────────────────────────────────────────
; MWOn12 is also an ASI loader. An .asi is a DLL with a different extension and
; no required exports -- it does its work from DllMain -- which is the format
; most existing Most Wanted mods already ship in. Drop them in and they run; no
; separate ASI loader is needed, and MWOn12 does not conflict with one if you
; already have it.
;
; Loaded from, in order:
;     <game>\scripts\          the convention other loaders use
;     <game>\MWOn12\ASI\
;
; Loading happens on the first Direct3DCreate9, which is before the game has
; drawn anything and therefore early enough for any hook an ASI installs.
;
; An ASI is not an MWOn12 plugin: it gets no D3D12 device and no per-frame
; callback. It is for changing the game. To draw, write a plugin instead --
; see MWOn12SDK.
[ASI]
; 0 disables ASI loading entirely.
Enabled=1
; Load from this directory instead of the two defaults. Relative to the game
; directory unless it names a drive. Leave empty for the defaults above.
Directory=

; ── Sample plugins ────────────────────────────────────────────────────────────
; Only read when the matching sample from MWOn12SDK is installed. Each is here
; as a worked example of a plugin reading its own settings from this file.
;
; [HelloGui]        ; the UI panel, as a plugin in MWOn12\Plugins\
; Enabled=1
; ToggleKey=45      ; virtual-key code. 45 = VK_INSERT, 112 = VK_F1
;
; [HelloGuiAsi]     ; the same panel, as an ASI in scripts\
; Enabled=1
; ToggleKey=36      ; 36 = VK_HOME
;
; [HelloAsi]        ; the frame-rate bar ASI
; Enabled=1
